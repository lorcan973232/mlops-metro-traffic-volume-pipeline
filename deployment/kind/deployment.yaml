apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-flask-api
  labels:
    app: mlops-flask-api
    component: prediction-api
spec:
  # Three replicas make the deployment visibly resilient in the demo while still
  # keeping the Kind cluster light enough for a coursework machine.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mlops-flask-api
  template:
    metadata:
      labels:
        app: mlops-flask-api
        component: prediction-api
    spec:
      containers:
        - name: api
          image: mlops-flask-api:latest
          imagePullPolicy: Never
          env:
            - name: MODEL_PATH
              value: models/wine_quality_classifier.joblib
          ports:
            - containerPort: 5000
              name: http
          # The health probes use the same endpoint as the smoke tests. This
          # catches startup and model-loading failures before traffic is sent.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
