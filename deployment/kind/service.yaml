apiVersion: v1
kind: Service
metadata:
  name: mlops-flask-api
  labels:
    app: mlops-flask-api
    component: prediction-api
spec:
  # ClusterIP is enough for Kind because the demo and workflow use port-forward
  # to reach the service. A cloud load balancer would add unnecessary setup.
  type: ClusterIP
  selector:
    app: mlops-flask-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
