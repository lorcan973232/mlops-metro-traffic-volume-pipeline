apiVersion: v1
kind: Service
metadata:
  name: mlops-flask-api
  labels:
    app: mlops-flask-api
    component: prediction-api
spec:
  # ClusterIP is enough for Kind because the demo and workflow use port-forward
  # to reach the service. A cloud load balancer would add unnecessary setup and
  # would make the evidence harder for a marker to reproduce locally.
  type: ClusterIP
  selector:
    app: mlops-flask-api
  ports:
    - name: http
      # The service exposes port 80 for a tidy demo URL while forwarding to the
      # Flask/Gunicorn container on port 5000.
      port: 80
      targetPort: 5000
