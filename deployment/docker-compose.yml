services:
  mlops-flask-api:
    # Docker Compose is a local convenience path for the same image that the
    # Docker Build workflow and Kind deployment use. It is useful during a demo
    # when the user wants to run the container without typing the full
    # `docker build` and `docker run` commands.
    build:
      context: ..
      dockerfile: Dockerfile
    image: mlops-flask-api:latest
    container_name: mlops-flask-api
    ports:
      # Host port 5001 avoids clashing with a local Flask process on 5000.
      - "5001:5000"
    healthcheck:
      # The health check exercises Flask's `/health` route, so Compose fails if
      # the model cannot be loaded inside the container.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
