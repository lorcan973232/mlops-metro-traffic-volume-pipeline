services:
  mlops-flask-api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mlops-flask-api:latest
    container_name: mlops-flask-api
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
