name: Continuous Training

# Continuous Training reruns the data, model-selection, training, evaluation,
# explainability, fairness, and simulated business-evidence stages on a schedule
# or manually. The quality-gate job is the important control: it rejects a
# candidate when required checks are missing or thresholds are not met.

permissions:
  contents: read

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  retrain-candidate:
    name: Retrain candidate from public dataset
    runs-on: ubuntu-latest
    steps:
      # This job creates a fresh candidate model and report set from the public
      # dataset. Nothing is promoted yet; the next job checks the quality gate.
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CT data, training, and evaluation stages
        env:
          FAST_MODE: "1"
        run: |
          python -m src.data
          python -m src.preprocess
          python -m src.model_selection
          python -m src.train
          python -m src.evaluate --fail-on-rejection
          python scripts/explain_model.py
          python scripts/fairness_audit.py
          python scripts/cost_benefit_analysis.py

      - name: Upload candidate model and metric reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ct-candidate
          path: |
            models/
            reports/metrics/
            reports/explainability/
            reports/fairness/
            reports/business/

  quality-gate:
    name: Compare latest metrics against baseline and thresholds
    runs-on: ubuntu-latest
    needs: retrain-candidate
    steps:
      # This job protects the project from accepting a weaker retrained model.
      # It reads the candidate reports and fails if key checks are missing or bad.
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download candidate artefacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ct-candidate
          path: .

      - name: Enforce CT metrics contract
        run: |
          # CT should not silently promote a weaker model. This check reads the
          # saved reports and fails the workflow if the candidate does not meet
          # the documented thresholds or if required evidence is missing.
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("reports/metrics/latest_metrics.json").read_text())
          gate = json.loads(Path("reports/metrics/quality_gate_report.json").read_text())
          feature_imp = json.loads(Path("reports/metrics/feature_importance.json").read_text())
          fairness = json.loads(Path("reports/fairness/fairness_report.json").read_text())
          explainability = json.loads(Path("reports/explainability/shap_summary.json").read_text())
          cost = json.loads(Path("reports/business/cost_benefit_report.json").read_text())
          required_checks = {
              "accuracy_above_minimum",
              "balanced_accuracy_above_minimum",
              "precision_macro_above_minimum",
              "recall_macro_above_minimum",
              "weighted_f1_above_minimum",
              "macro_f1_above_minimum",
              "per_class_metrics_above_minimum",
              "cv_accuracy_above_minimum",
              "cv_f1_macro_above_minimum",
              "roc_auc_above_minimum",
              "accuracy_beats_baseline_margin",
          }
          missing_checks = sorted(required_checks - set(gate["checks"]))
          if missing_checks:
              raise SystemExit(f"Quality gate is missing checks: {missing_checks}")
          if feature_imp.get("status") != "computed":
              raise SystemExit("Feature importance not computed")
          if fairness.get("status") != "completed":
              raise SystemExit("Fairness analysis not completed")
          if not explainability.get("computed_from_model"):
              raise SystemExit("Explainability report was not computed from model")
          if cost["assumptions"]["assumption_type"] != "SIMULATED_ASSUMPTIONS":
              raise SystemExit("Cost-benefit assumptions not labelled simulated")
          print(json.dumps({"latest_metrics": latest["metric_summary"], "quality_gate": gate, "feature_importance_status": feature_imp["status"], "fairness_status": fairness["status"], "explainability_status": explainability["status"], "cost_benefit_status": cost["status"]}, indent=2))
          if not gate["passed"]:
              raise SystemExit("Continuous Training rejected candidate model.")
          PY

      - name: Upload quality-gate report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ct-quality-gate
          path: reports/metrics/quality_gate_report.json

  promote-model:
    name: Register accepted model metadata
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      # This job only runs after the quality gate passes. It records metadata for
      # the accepted candidate so later monitoring and demos can see the version.
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download accepted candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: ct-candidate
          path: .

      - name: Register accepted candidate
        run: python -m src.model_registry

      - name: Upload promoted model and metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: continuous-training-artifacts
          path: |
            models/
            reports/metrics/
            reports/explainability/
            reports/fairness/
            reports/business/
