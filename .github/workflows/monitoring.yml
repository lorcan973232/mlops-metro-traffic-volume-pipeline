name: Monitoring

# Monitoring is offline and simulated for this coursework artefact. The workflow
# still matters because it rebuilds model metadata, checks the processed batch
# for schema/data-quality issues, runs deterministic PSI drift checks, and uploads
# retraining flags for marker inspection.

permissions:
  contents: read

"on":
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  prepare-model-metadata:
    name: Prepare model metadata for monitoring context
    runs-on: ubuntu-latest
    steps:
      # Monitoring needs model metadata before it can write useful reports. This
      # job rebuilds the normal data, training, and evaluation path first.
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build latest model metadata
        run: |
          python -m src.data
          python -m src.preprocess
          python -m src.train
          python -m src.evaluate
          python -m src.model_registry

      - name: Upload model metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: monitoring-model-metadata
          path: reports/metrics/model_metadata.json

  batch-monitoring:
    name: Simulated batch monitoring and drift checks
    runs-on: ubuntu-latest
    needs: prepare-model-metadata
    steps:
      # This job is the scheduled monitoring evidence. It checks the processed
      # dataset and drift logic, then uploads reports for review.
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare selected public dataset
        run: |
          python -m src.data
          python -m src.preprocess

      - name: Download model metadata evidence
        uses: actions/download-artifact@v8.0.1
        with:
          name: monitoring-model-metadata
          path: reports/metrics/

      - name: Run simulated continuous monitoring checks
        # Lightweight monitoring evidence: schema, missing values, and feature
        # summaries are checked repeatably without claiming production telemetry.
        run: python scripts/monitor.py

      - name: Run drift check with retraining recommendation flag
        # The drift script includes a deterministic shifted batch so the marker
        # can see that drift detection and retraining flags actually execute.
        run: python scripts/check_drift.py

      - name: Show monitoring mode and retraining recommendation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          monitoring = json.loads(Path("reports/monitoring/monitoring_report.json").read_text())
          drift = json.loads(Path("reports/monitoring/drift_report.json").read_text())
          metadata = json.loads(Path("reports/metrics/model_metadata.json").read_text())
          required_monitoring = {"timestamp_utc", "monitoring_mode", "model_version", "data_quality", "retraining_required", "reason"}
          data_quality = json.loads(Path("reports/monitoring/data_quality_report.json").read_text())
          required_drift = {"timestamp_utc", "monitoring_mode", "model_version", "data_quality_status", "drift_score", "retraining_required", "reason", "schema_validation", "missing_value_checks", "feature_distribution_checks"}
          missing_monitoring = sorted(required_monitoring - set(monitoring))
          missing_drift = sorted(required_drift - set(drift))
          if missing_monitoring or missing_drift:
              raise SystemExit({
                  "missing_monitoring_fields": missing_monitoring,
                  "missing_drift_fields": missing_drift,
              })
          print(json.dumps({
              "monitoring_mode": monitoring["monitoring_mode"],
              "data_quality_status": data_quality["status"],
              "model_version": metadata["model_version"],
              "retraining_required": drift["retraining_required"],
              "retraining_recommended": drift["retraining_recommended"],
              "drift_score": drift["drift_score"],
              "production_limitation": monitoring["production_limitation"],
          }, indent=2))
          PY

      - name: Upload monitoring reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: monitoring-artifacts
          path: |
            reports/monitoring/
            reports/metrics/model_metadata.json
