name: Train and Evaluate

"on":
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-and-evaluate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-and-evaluate.yml"

jobs:
  prepare-data:
    name: Prepare selected public dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest and preprocess
        run: |
          python -m src.data
          python -m src.preprocess

      - name: Upload prepared data evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepared-data
          path: |
            data/processed/winequality-red-processed.csv
            reports/metrics/data_ingestion.json
            reports/metrics/preprocessing.json

  train-evaluate:
    name: Train, evaluate, and register candidate model
    runs-on: ubuntu-latest
    needs: prepare-data
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training and evaluation pipeline
        run: |
          python -m src.data
          python -m src.preprocess
          python -m src.model_selection
          python -m src.train
          python -m src.evaluate
          python -m src.model_registry
          python -m src.predict

      - name: Upload model, metrics, and metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: train-evaluate-artifacts
          path: |
            models/
            reports/metrics/
