name: Train and Evaluate

permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-and-evaluate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train-and-evaluate.yml"

jobs:
  prepare-data:
    name: Prepare selected public dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest and preprocess
        run: |
          python -m src.data
          python -m src.preprocess

      - name: Upload prepared data evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepared-data
          path: |
            data/processed/winequality-red-processed.csv
            reports/metrics/data_ingestion.json
            reports/metrics/preprocessing.json

  train-evaluate:
    name: Train, evaluate, and register candidate model
    runs-on: ubuntu-latest
    needs: prepare-data
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training and evaluation pipeline
        env:
          FAST_MODE: "1"
        run: |
          python -m src.data
          python -m src.preprocess
          python -m src.model_selection
          python -m src.train
          python -m src.evaluate
          python -m src.model_registry
          python -m src.predict
          python scripts/explain_model.py
          python scripts/fairness_audit.py
          python scripts/cost_benefit_analysis.py

      - name: Validate full metric and metadata package
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "reports/metrics/latest_metrics.json",
              "reports/metrics/baseline_metrics.json",
              "reports/metrics/quality_gate_report.json",
              "reports/metrics/model_metadata.json",
              "reports/metrics/model_comparison.json",
              "reports/metrics/hyperparameter_search_results.json",
              "reports/metrics/classification_report.json",
              "reports/metrics/confusion_matrix.json",
              "reports/metrics/confusion_matrix_normalized.json",
              "reports/metrics/cross_validation_results.json",
              "reports/metrics/feature_importance.json",
              "reports/metrics/fairness_analysis.json",
              "reports/metrics/ensemble_comparison.json",
              "reports/explainability/shap_summary.json",
              "reports/fairness/fairness_report.json",
              "reports/business/cost_benefit_report.json",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f"Missing required evaluation artefacts: {missing}")
          print("Full model metric and metadata package is present (including explainability and fairness).")
          PY

      - name: Upload model, metrics, and metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: train-evaluate-artifacts
          path: |
            models/
            reports/metrics/
            reports/explainability/
            reports/fairness/
            reports/business/
