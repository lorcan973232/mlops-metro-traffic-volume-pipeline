name: Docker Build

permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker-build:
    name: Build image tagged with commit SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python for host-side benchmark
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Docker evidence must prove more than a successful image build. The image
      # is started, health-checked, smoke-tested, and benchmarked so the marker can
      # see the packaged Flask service works without manual local files.
      - name: Build Docker image
        run: |
          docker build \
            -t mlops-flask-api:${{ github.sha }} \
            -t mlops-flask-api:latest \
            .

      - name: Run Docker container
        run: |
          docker run -d --name mlops-flask-api -p 5001:5000 mlops-flask-api:${{ github.sha }}
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready}" -ne 1 ]; then
            docker logs mlops-flask-api
            exit 1
          fi

      - name: Docker API smoke test
        run: bash scripts/smoke_test_api.sh http://127.0.0.1:5001

      - name: Benchmark Docker API latency and SLA
        run: |
          python scripts/benchmark_api.py http://127.0.0.1:5001 --samples 50 --warmup 10
          mkdir -p docker-smoke-logs
          cp reports/benchmarks/api_sla_report.json docker-smoke-logs/api_sla_report.json

      - name: Upload Docker smoke logs
        if: always()
        run: docker logs mlops-flask-api > docker-smoke.log 2>&1 || true

      - name: Publish Docker smoke logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-smoke-logs
          path: |
            docker-smoke.log
            docker-smoke-logs/
