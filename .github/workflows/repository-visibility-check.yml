name: Repository Visibility Check

# This workflow records the current repository visibility on a schedule or
# manually, then uploads a timestamped snapshot from the run.

permissions:
  contents: read

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  visibility:
    name: Verify repository remains public
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Repository visibility can change, so this workflow gives a repeatable
      # check that can be rerun before a demo.
      - name: Check GitHub repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/check_repo_visibility.py

      - name: Upload repository visibility evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-visibility-evidence
          path: reports/submission/public_repository_evidence.json
