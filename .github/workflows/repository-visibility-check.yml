name: Repository Visibility Check

# The public-until requirement needs repeatable evidence. This workflow checks
# the current repository visibility on a schedule or manually, then uploads a
# timestamped snapshot without claiming future public access is already proven.

permissions:
  contents: read

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  visibility:
    name: Verify repository remains public
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Future public access cannot be proven once and for all, so this workflow
      # gives a repeatable check that can be rerun before submission and demo.
      - name: Check GitHub repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/check_repo_visibility.py

      - name: Upload repository visibility evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-visibility-evidence
          path: reports/submission/public_repository_evidence.json
