name: Data Preprocessing

# This workflow isolates the raw-data and preprocessing stages. It runs when the
# data or preprocessing code changes, then uploads the ingestion and processed
# CSV reports so the marker can trace exactly where the training table came from.

permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "src/data.py"
      - "src/preprocess.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/data-preprocessing.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/data.py"
      - "src/preprocess.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/data-preprocessing.yml"

jobs:
  ingest:
    name: Ingest and validate public dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # This stage proves the public data can be acquired and validated before any
      # model is trained. The report is uploaded separately so ingestion evidence
      # is not hidden inside the training workflow.
      - name: Generate and validate UCI Wine Quality data
        run: python -m src.data

      - name: Upload ingestion report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-ingestion-report
          path: reports/metrics/data_ingestion.json

  preprocess:
    name: Preprocess deterministic classification dataset
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Preprocessing is run after ingestion so the marker can trace raw data into
      # the deterministic CSV used by training, testing, Docker, and CT.
      - name: Run ingestion and preprocessing
        run: |
          python -m src.data
          python -m src.preprocess

      - name: Verify processed data output
        run: test -s data/processed/winequality-red-processed.csv

      - name: Show processed-data summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ingestion = json.loads(Path("reports/metrics/data_ingestion.json").read_text())
          preprocessing = json.loads(Path("reports/metrics/preprocessing.json").read_text())
          print(json.dumps({
              "dataset": ingestion["dataset"],
              "download_status": ingestion["ingestion"]["status"],
              "raw_sha256": ingestion["ingestion"]["sha256"],
              "rows": preprocessing["rows"],
              "target_distribution": preprocessing["target_distribution"],
              "processed_output": preprocessing["output"],
          }, indent=2))
          PY

      - name: Upload preprocessing artefacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preprocessing-artifacts
          path: |
            data/processed/winequality-red-processed.csv
            reports/metrics/data_ingestion.json
            reports/metrics/preprocessing.json
