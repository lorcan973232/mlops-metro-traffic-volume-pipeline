name: Data Preprocessing

"on":
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "src/data.py"
      - "src/preprocess.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/data-preprocessing.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/data.py"
      - "src/preprocess.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/data-preprocessing.yml"

jobs:
  ingest:
    name: Ingest and validate public dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and validate UCI Energy Efficiency data
        run: python -m src.data

      - name: Upload ingestion report
        uses: actions/upload-artifact@v4
        with:
          name: data-ingestion-report
          path: reports/metrics/data_ingestion.json

  preprocess:
    name: Preprocess deterministic regression dataset
    runs-on: ubuntu-latest
    needs: ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion and preprocessing
        run: |
          python -m src.data
          python -m src.preprocess

      - name: Verify processed data output
        run: test -s data/processed/energy-efficiency-processed.csv

      - name: Upload preprocessing artefacts
        uses: actions/upload-artifact@v4
        with:
          name: preprocessing-artifacts
          path: |
            data/processed/energy-efficiency-processed.csv
            reports/metrics/data_ingestion.json
            reports/metrics/preprocessing.json
